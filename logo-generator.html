<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Python Jungle Logo Generator</title>
<style>
body{background:#0D1B0D;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;flex-direction:column;gap:20px;font-family:monospace}
canvas{border:2px solid #FFD700;border-radius:12px}
button{background:#2D8F4E;color:#FFD700;border:2px solid #FFD700;padding:12px 24px;font-size:14px;cursor:pointer;border-radius:8px}
button:hover{background:#3AAF5E}
</style>
</head>
<body>
<h2 style="color:#FFD700">Python Jungle Logo</h2>
<canvas id="logo512" width="512" height="512"></canvas>
<canvas id="logo64" width="64" height="64"></canvas>
<canvas id="logo32" width="32" height="32"></canvas>
<button onclick="downloadAll()">Download All PNG Files</button>
<script>
function drawLogo(canvas,size){
var ctx=canvas.getContext('2d'),s=size;
ctx.fillStyle='#0D1B0D';rr(ctx,0,0,s,s,s*.15);ctx.fill();
ctx.strokeStyle='#FFD700';ctx.lineWidth=s*.025;rr(ctx,s*.02,s*.02,s*.96,s*.96,s*.12);ctx.stroke();
var g=ctx.createRadialGradient(s*.5,s*.45,0,s*.5,s*.45,s*.5);
g.addColorStop(0,'rgba(45,143,78,0.4)');g.addColorStop(1,'rgba(13,27,13,0)');
ctx.fillStyle=g;rr(ctx,s*.08,s*.08,s*.84,s*.84,s*.1);ctx.fill();
ctx.strokeStyle='#2D8F4E';ctx.lineWidth=s*.055;ctx.lineCap='round';ctx.lineJoin='round';
ctx.beginPath();ctx.moveTo(s*.3,s*.3);
ctx.bezierCurveTo(s*.3,s*.15,s*.55,s*.15,s*.55,s*.3);
ctx.bezierCurveTo(s*.55,s*.48,s*.78,s*.48,s*.78,s*.63);
ctx.bezierCurveTo(s*.78,s*.78,s*.5,s*.78,s*.5,s*.63);ctx.stroke();
ctx.strokeStyle='#6ABF69';ctx.lineWidth=s*.02;
ctx.beginPath();ctx.moveTo(s*.3,s*.3);
ctx.bezierCurveTo(s*.3,s*.15,s*.55,s*.15,s*.55,s*.3);
ctx.bezierCurveTo(s*.55,s*.48,s*.78,s*.48,s*.78,s*.63);
ctx.bezierCurveTo(s*.78,s*.78,s*.5,s*.78,s*.5,s*.63);ctx.stroke();
ctx.fillStyle='#2D8F4E';ctx.beginPath();ctx.ellipse(s*.3,s*.3,s*.07,s*.055,-.3,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#6ABF69';ctx.lineWidth=s*.015;ctx.stroke();
ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(s*.27,s*.285,s*.018,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#0D1B0D';ctx.beginPath();ctx.arc(s*.27,s*.285,s*.008,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#E74C3C';ctx.lineWidth=s*.008;
ctx.beginPath();ctx.moveTo(s*.24,s*.3);ctx.lineTo(s*.2,s*.28);ctx.moveTo(s*.24,s*.3);ctx.lineTo(s*.2,s*.32);ctx.stroke();
ctx.fillStyle='#1A6B3C';ctx.beginPath();ctx.arc(s*.5,s*.63,s*.025,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#2D8F4E';leaf(ctx,s*.85,s*.18,s*.04,s*.02,.3);leaf(ctx,s*.15,s*.82,s*.04,s*.02,.8);leaf(ctx,s*.88,s*.85,s*.035,s*.018,-.5);
if(s>=128){ctx.fillStyle='#FFD700';ctx.font='bold '+s*.18+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(255,215,0,0.5)';ctx.shadowBlur=s*.03;ctx.fillText('PY',s*.5,s*.48);ctx.shadowBlur=0;}
if(s>=256){ctx.fillStyle='#A8C89A';ctx.font=s*.055+'px monospace';ctx.textAlign='center';ctx.fillText('PYTHON JUNGLE',s*.5,s*.9);}
}
function leaf(ctx,x,y,w,h,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,0,w,h,0,0,Math.PI*2);ctx.fill();ctx.restore();}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function downloadAll(){[512,64,32].forEach(function(sz){var c=document.getElementById('logo'+sz),l=document.createElement('a');l.download='python-jungle-'+sz+'x'+sz+'.png';l.href=c.toDataURL('image/png');l.click();});}
drawLogo(document.getElementById('logo512'),512);drawLogo(document.getElementById('logo64'),64);drawLogo(document.getElementById('logo32'),32);
</script>
</body>
</html>
